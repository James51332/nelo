[package]
name = "nelo"
version = "0.3.0"
edition = "2024"
authors = ["James Dadabo"]
repository = "https://github.com/James51332/nelo"
description = "A stateless, timeline-driven animation engine for explorable visual animations."
readme = "README.md"
license = "MIT"
keywords = ["animation", "video", "graphics"]
categories = ["graphics", "multimedia::video"]

[dependencies]
log = "0.4.33"
bytemuck = { version = "1", features = ["derive"] }
glam = { version = "0.33.2", features = ["bytemuck"] }
wgpu = "30"
pollster = "0.4.0"
lyon = "1.0.19"
ab_glyph = "0.2.32"
glyph_brush_layout = "0.2.4"
png = "0.17"
palette = "0.7.7"
ratex-layout = "0.1.14"
ratex-parser = "0.1.14"
ratex-types = "0.1.14"
winit = { version = "0.30.13", optional = true }
egui = { version = "0.36.1", optional = true }
egui-wgpu = { version = "0.36.1", optional = true }
egui-winit = { version = "0.36.1", optional = true }

[features]
default = ["story", "render", "viewer", "export"]
scene = []
render = ["scene"]
story = ["scene"]
export = ["render"]
viewer = ["render", "dep:winit", "dep:egui", "dep:egui-wgpu", "dep:egui-winit"]

[[example]]
name = "image"
path = "examples/image.rs"
required-features = ["story", "export"]

[[example]]
name = "video"
path = "examples/video.rs"
required-features = ["story", "export"]

[[example]]
name = "app"
path = "examples/app.rs"
required-features = ["story", "viewer"]


